<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unlock AI Email Agent</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080c14;color:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif}
    main{width:min(380px,calc(100vw - 32px));border:1px solid #263244;background:#101827;border-radius:12px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    h1{font-size:24px;margin:0 0 8px}
    p{color:#94a3b8;line-height:1.5;margin:0 0 22px}
    label{display:block;font-size:13px;color:#cbd5e1;margin-bottom:8px}
    input{box-sizing:border-box;width:100%;border:1px solid #334155;background:#0b1220;color:#f8fafc;border-radius:8px;padding:12px;font-size:20px;letter-spacing:5px;text-align:center}
    button{width:100%;margin-top:16px;border:0;border-radius:8px;background:#22d3ee;color:#05131a;font-weight:700;padding:12px;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    [role=alert]{min-height:20px;color:#fca5a5;font-size:13px;margin-top:12px}
  </style>
</head>
<body>
  <main>
    <h1>Unlock dashboard</h1>
    <p>Enter the local dashboard PIN to review drafts, mailbox status, settings, and activity logs.</p>
    <form id="login-form">
      <label for="pin">Dashboard PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" minlength="4" maxlength="12" required autofocus />
      <button type="submit">Unlock</button>
      <div role="alert" id="message"></div>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = event.target.querySelector('button');
      const message = document.getElementById('message');
      button.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/api/unlock', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({pin: document.getElementById('pin').value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unlock failed');
        window.location.href = '/';
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
