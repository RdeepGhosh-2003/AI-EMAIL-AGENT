<style>
*{box-sizing:border-box}body{margin:0;background:#0c1423;color:#e4eaf4;font:15px system-ui,sans-serif}button,input,select{font:inherit}button{color:inherit;cursor:pointer;background:#17283e;border:1px solid #354a66;border-radius:8px;padding:9px 14px}button:disabled{opacity:.45;cursor:default}.back-button{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid #354a66;border-radius:9px;background:#17283e;color:#9fc7ff;text-decoration:none;font-size:19px}.provider-title{font-weight:700;padding:9px 14px;border:1px solid #354a66;border-radius:8px;background:#132136;color:#63b6ff}nav{padding:20px 32px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #2c3c54;flex-wrap:wrap}.inbox-tools{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.pager{display:flex;gap:8px;align-items:center}.search{position:relative;min-width:220px;max-width:320px;flex:1}.search span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8aa0ba}.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid #354a66;border-radius:8px;background:#152239;color:#e4eaf4}.segmented,.date-presets{display:flex;border:1px solid #354a66;border-radius:9px;overflow:hidden;background:#101b2c}.segmented button,.date-presets button{border:0;border-radius:0;background:transparent;padding:9px 10px;color:#9fb5cf;white-space:nowrap}.segmented button.active,.date-presets button.active{background:#203650;color:#fff}.date-controls{position:relative;display:flex;align-items:center;gap:8px}.calendar-btn{padding:9px 11px}.calendar-popover{position:absolute;top:44px;right:0;z-index:20;width:286px;padding:12px;border:1px solid #354a66;border-radius:12px;background:#0d1728;box-shadow:0 18px 45px rgba(0,0,0,.45)}.calendar-popover.hidden{display:none}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:#d8e5f5;font-weight:700}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-dow,.cal-day{height:30px;display:grid;place-items:center;border-radius:7px;font-size:12px}.cal-dow{height:22px;color:#6f87a4;font-weight:700}.cal-day{border:1px solid transparent;color:#bfd0e4}.cal-day.muted{color:#526780}.cal-day.in-range{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.25)}.cal-day.range-edge{background:#245491;border-color:#6aa1ff;color:#fff}.cal-day.today{box-shadow:inset 0 0 0 1px #fbbf24}#status{color:#b7c9dc;white-space:nowrap}.preview-ribbon{position:fixed;right:16px;bottom:14px;padding:8px 11px;border:1px solid rgba(124,58,237,.45);border-radius:8px;background:rgba(30,24,55,.92);color:#d8ccff;font-size:11px;font-weight:700;z-index:10}main{display:grid;grid-template-columns:minmax(320px,38%) 1fr;height:calc(100vh - 132px);min-height:580px;margin:12px 32px 24px;border:1px solid #2c3c54;border-radius:12px;overflow:hidden}.list{border-right:1px solid #2c3c54;min-height:0}#messages{height:100%;overflow:auto}.mail{display:block;width:100%;min-height:78px;border:0;border-bottom:1px solid #29384d;border-radius:0;text-align:left;background:transparent;padding:9px 17px}.mail:hover,.mail.selected{background:#183146}.mail strong,.mail span,.mail small,.mail em{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mail strong{font-size:13px;line-height:17px}.mail span{color:#b7c9dc;font-size:12px;line-height:16px}.mail em{margin-top:2px;color:#8398b2;font-style:normal;font-size:12px;line-height:16px}.mail small{margin-top:2px;color:#829ab4;font-size:11px;line-height:15px}article{padding:26px;min-width:0;overflow:auto}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}h2{font-size:21px;margin:0 0 12px;overflow-wrap:anywhere}.sender{color:#b7c9dc;overflow-wrap:anywhere}.create-draft{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.12);color:#73e7bd;font-weight:700;white-space:nowrap}pre{font:15px/1.65 system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}.empty-help{max-width:520px;margin-top:18px;color:#8fa4bf;line-height:1.55}.empty-help strong{color:#e4eaf4}@media(max-width:1350px){.inbox-tools{flex-wrap:wrap}#status{white-space:normal}.search{min-width:160px}.date-controls{order:2}}@media(max-width:760px){nav{padding:18px}.inbox-tools{flex-direction:column;align-items:stretch}.pager,.segmented,.date-presets{width:100%}.pager button,.segmented button,.date-presets button{flex:1}.search{max-width:none}.date-controls{align-items:stretch}.calendar-popover{left:0;right:auto;width:min(286px,100vw - 36px)}main{height:auto;margin:12px;grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid #2c3c54}#messages{height:620px}.detail-head{flex-direction:column}}
</style>
<nav>
  <a class="back-button" href="inbox.html?provider=outlook" aria-label="Back to inbox" title="Back">←</a>
  <span class="provider-title">Outlook inbox</span>
  <button id="refresh">↻ Refresh</button>
  <div class="inbox-tools">
    <div class="pager"><button id="first">Newest</button><button id="next" disabled>Older emails →</button></div>
    <label class="search"><span>🔍</span><input id="search" placeholder="Search sender or subject"></label>
    <div class="segmented" aria-label="Read filter"><button data-read-mode="all" class="active">All</button><button data-read-mode="unread">Unread</button><button data-read-mode="read">Read</button></div>
    <div class="date-controls">
      <div class="date-presets" aria-label="Date filter">
        <button data-date-mode="all" class="active">All</button>
        <button data-date-mode="today">Today</button>
        <button data-date-mode="yesterday">Yesterday</button>
        <button data-date-mode="7">Last 7 days</button>
        <button data-date-mode="thisMonth">This Month</button>
        <button data-date-mode="lastMonth">Last Month</button>
      </div>
      <button class="calendar-btn" id="calendar-toggle" title="Calendar">📅</button>
      <div class="calendar-popover hidden" id="calendar-popover"><div class="calendar-head"><span id="calendar-title"></span><span id="calendar-range"></span></div><div class="calendar-grid" id="calendar-grid"></div></div>
    </div>
    <div id="status" role="status">Loading Outlook…</div>
  </div>
</nav>
<main><section class="list"><div id="messages"></div></section><article><div class="detail-head"><div><h2 id="subject">Select an email</h2><div class="sender" id="sender"></div></div><button class="create-draft" id="create-draft" disabled>✨ Create draft reply</button></div><pre id="body" class="empty-help"><strong>Preview demo</strong>
Select a message to preview it here. In the final version, Create draft reply would send this email into your AI Draft Review queue.</pre></article></main>
<div class="preview-ribbon">PREVIEW ONLY</div>
<script src="security.js?v=20260922-preview"></script>
<script>
const $=id=>document.getElementById(id);const provider='outlook';let nextPage=null,generation=0,selection=0,allMessages=[],readMode='all',dateMode='all',dateRange=null;const sampleSnippets=['Please confirm the next step and share any documents needed.','Following up on the recent discussion and pending approval.','Invoice/payment details are included for your review.','Meeting request with timing and agenda details.','Access or account related notification from the sender.'];
function snippetFor(m,i){return m.preview||m.bodyPreview||m.snippet||sampleSnippets[i%sampleSnippets.length]}
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function rangeFor(mode){const today=dayStart(new Date());if(mode==='all')return null;if(mode==='today')return{start:today,end:today};if(mode==='yesterday'){const y=addDays(today,-1);return{start:y,end:y}}if(mode==='7')return{start:addDays(today,-6),end:today};if(mode==='thisMonth')return{start:new Date(today.getFullYear(),today.getMonth(),1),end:new Date(today.getFullYear(),today.getMonth()+1,0)};if(mode==='lastMonth')return{start:new Date(today.getFullYear(),today.getMonth()-1,1),end:new Date(today.getFullYear(),today.getMonth(),0)};return null}
function sameDay(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function labelDate(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function setDateMode(mode){dateMode=mode;dateRange=rangeFor(mode);document.querySelectorAll('[data-date-mode]').forEach(b=>b.classList.toggle('active',b.dataset.dateMode===mode));renderCalendar();renderMessages()}
function matchesDate(m){if(!dateRange)return true;const d=dayStart(new Date(m.date));if(Number.isNaN(d.getTime()))return true;return d>=dateRange.start&&d<=dateRange.end}
function renderCalendar(){const grid=$('calendar-grid');grid.replaceChildren();const today=dayStart(new Date());const titleBase=dateRange?.end||today;$('calendar-title').textContent=titleBase.toLocaleDateString(undefined,{month:'long',year:'numeric'});$('calendar-range').textContent=dateRange?(sameDay(dateRange.start,dateRange.end)?labelDate(dateRange.start):labelDate(dateRange.start)+' - '+labelDate(dateRange.end)):'All dates';['S','M','T','W','T','F','S'].forEach(d=>{const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.append(el)});const monthStart=new Date(titleBase.getFullYear(),titleBase.getMonth(),1);const first=addDays(monthStart,-monthStart.getDay());for(let i=0;i<42;i++){const d=addDays(first,i);const el=document.createElement('div');el.className='cal-day';el.textContent=d.getDate();if(d.getMonth()!==titleBase.getMonth())el.classList.add('muted');if(dateRange&&d>=dateRange.start&&d<=dateRange.end)el.classList.add('in-range');if(dateRange&&(sameDay(d,dateRange.start)||sameDay(d,dateRange.end)))el.classList.add('range-edge');if(sameDay(d,today))el.classList.add('today');grid.append(el)}}
function filtered(){const q=$('search').value.trim().toLowerCase();return allMessages.filter((m,i)=>(readMode==='all'||(readMode==='unread'?m.unread:!m.unread))&&matchesDate(m)&&(!q||[m.subject,m.sender_name,m.sender,snippetFor(m,i)].filter(Boolean).join(' ').toLowerCase().includes(q)))}
function renderMessages(){const list=filtered();$('messages').replaceChildren();list.forEach((m,i)=>{const b=document.createElement('button');b.className='mail';b.innerHTML='<strong></strong><span></span><em></em><small></small>';b.querySelector('strong').textContent=(m.unread?'● ':'')+(m.subject||'(No subject)');b.querySelector('span').textContent=m.sender_name||m.sender||'Unknown sender';b.querySelector('em').textContent=snippetFor(m,i);b.querySelector('small').textContent=m.date||'';b.onclick=()=>openMessage(m.id,b);$('messages').append(b)});$('status').textContent=list.length+' of '+allMessages.length+' outlook emails shown. Viewing here does not mark them as read.'}
async function api(params){const r=await fetch('/api/inbox/'+provider+'?'+new URLSearchParams(params),{headers:{Accept:'application/json'}});const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json'))throw Error('Mailbox API is unavailable on this address.');const data=await r.json();if(!r.ok)throw Error(data.error||'Could not load emails');return data}
async function load(page='',reset=false){const gen=++generation;++selection;const had=allMessages.length>0;if(reset){allMessages=[];$('messages').replaceChildren()}$('next').disabled=true;$('status').textContent=(had&&!reset?'Refreshing ':'Loading ')+provider+'…';$('subject').textContent='Select an email';$('sender').textContent='';$('body').className='empty-help';$('body').textContent='Select a message to preview it here. In the final version, Create draft reply would send this email into your AI Draft Review queue.';$('create-draft').disabled=true;try{const data=await api(page?{page}:{});if(gen!==generation)return;nextPage=data.next_page;allMessages=data.messages||[];renderMessages();$('next').disabled=!nextPage}catch(e){$('status').textContent=e.message}}
async function openMessage(id,button){const gen=generation,sel=++selection;document.querySelectorAll('.mail').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');$('subject').textContent='Loading message…';$('sender').textContent='';$('body').textContent='';$('create-draft').disabled=true;try{const {message:m}=await api({id});if(gen!==generation||sel!==selection)return;$('subject').textContent=m.subject||'(No subject)';$('sender').textContent=(m.sender_name?m.sender_name+' — ':'')+m.sender+' · '+m.date;$('body').className='';$('body').textContent=m.body||'(No text body)';$('create-draft').disabled=false}catch(e){if(gen===generation&&sel===selection)$('subject').textContent=e.message}}
$('refresh').onclick=()=>load();$('first').onclick=()=>load();$('next').onclick=()=>load(nextPage,true);$('search').oninput=renderMessages;document.querySelectorAll('[data-date-mode]').forEach(b=>b.onclick=()=>setDateMode(b.dataset.dateMode));document.querySelectorAll('[data-read-mode]').forEach(b=>b.onclick=()=>{readMode=b.dataset.readMode;document.querySelectorAll('[data-read-mode]').forEach(x=>x.classList.toggle('active',x===b));renderMessages()});$('calendar-toggle').onclick=()=>$('calendar-popover').classList.toggle('hidden');$('create-draft').onclick=()=>alert('Preview only: this would create an AI draft reply for the selected email.');setDateMode('all');load();
</script>
</html>
