<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My emails — AI Email Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1423;color:#e4eaf4;font:15px system-ui,sans-serif}a{color:#7cdded}button,input{font:inherit}button{color:inherit;cursor:pointer;background:#17283e;border:1px solid #354a66;border-radius:8px;padding:9px 14px}button:disabled{opacity:.45;cursor:default}.back-button{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid #354a66;border-radius:9px;background:#17283e;color:#9fc7ff;text-decoration:none;font-size:19px}.back-button:hover{background:#203650;border-color:#5c7da8}nav{padding:20px 32px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #2c3c54;flex-wrap:wrap}.provider-title{font-weight:700;padding:9px 14px;border:1px solid #354a66;border-radius:8px;background:#132136}.provider-title.outlook{color:#63b6ff}.inbox-tools{display:flex;align-items:center;gap:10px;min-width:0;flex:1;flex-wrap:wrap}.pager{display:flex;gap:8px;align-items:center;flex:0 0 auto}.pager button{padding:8px 14px}.search{position:relative;min-width:220px;max-width:320px;flex:0 1 320px}.search span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8aa0ba}.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid #354a66;border-radius:8px;background:#152239;color:#e4eaf4}.segmented,.date-presets{display:flex;border:1px solid #354a66;border-radius:9px;overflow:hidden;background:#101b2c;flex:0 0 auto}.segmented button,.date-presets button{border:0;border-radius:0;background:transparent;padding:9px 10px;color:#9fb5cf;white-space:nowrap}.segmented button.active,.date-presets button.active{background:#203650;color:#fff}.date-controls{position:relative;display:flex;align-items:center;gap:8px;flex:0 0 auto}.calendar-btn{padding:9px 11px;flex:0 0 auto}.calendar-popover{position:absolute;top:44px;right:0;z-index:20;width:286px;padding:12px;border:1px solid #354a66;border-radius:12px;background:#0d1728;box-shadow:0 18px 45px rgba(0,0,0,.45)}.calendar-popover.hidden{display:none}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:#d8e5f5;font-weight:700}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-dow,.cal-day{height:30px;display:grid;place-items:center;border-radius:7px;font-size:12px}.cal-dow{height:22px;color:#6f87a4;font-weight:700}.cal-day{border:1px solid transparent;color:#bfd0e4}.cal-day.muted{color:#526780}.cal-day.in-range{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.25)}.cal-day.range-edge{background:#245491;border-color:#6aa1ff;color:#fff}.cal-day.today{box-shadow:inset 0 0 0 1px #fbbf24}#status{color:#b7c9dc;min-width:0;white-space:normal;flex:1 0 100%;font-size:14px}main{display:grid;grid-template-columns:minmax(320px,38%) 1fr;height:calc(100vh - 148px);min-height:560px;margin:12px 32px 24px;border:1px solid #2c3c54;border-radius:12px;overflow:hidden}.list{border-right:1px solid #2c3c54;min-height:0}#messages{height:100%;overflow:auto}.mail{display:block;width:100%;min-height:78px;border:0;border-bottom:1px solid #29384d;border-radius:0;text-align:left;background:transparent;padding:9px 17px}.mail:hover,.mail.selected{background:#183146}.mail strong,.mail span,.mail small,.mail em{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mail strong{font-size:13px;line-height:17px}.mail span{color:#b7c9dc;font-size:12px;line-height:16px}.mail em{margin-top:2px;color:#8398b2;font-style:normal;font-size:12px;line-height:16px}.mail small{margin-top:2px;color:#829ab4;font-size:11px;line-height:15px}article{padding:26px;min-width:0;overflow:auto}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}h2{font-size:21px;margin:0 0 12px;overflow-wrap:anywhere}#sender{color:#b7c9dc;overflow-wrap:anywhere}.create-draft{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.12);color:#73e7bd;font-weight:700;white-space:nowrap}.empty-help{max-width:520px;margin-top:18px;color:#8fa4bf;line-height:1.55}.toast{position:fixed;right:18px;bottom:18px;z-index:30;max-width:360px;padding:11px 14px;border:1px solid #355477;border-radius:10px;background:#101b2c;color:#d8e5f5;box-shadow:0 18px 45px rgba(0,0,0,.38)}.toast.ok{border-color:rgba(16,185,129,.5);color:#bdf7dc}.toast.err{border-color:rgba(248,113,113,.55);color:#fecaca}pre{font:15px/1.65 system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:1350px){#status{white-space:normal}.search{min-width:170px;flex-basis:260px}.date-presets{flex-wrap:wrap}.date-controls{flex-wrap:wrap}}@media(max-width:760px){nav{padding:18px}.inbox-tools{align-items:stretch;flex-direction:column}.pager,.segmented,.date-presets{width:100%}.pager button,.segmented button,.date-presets button{flex:1}.search{max-width:none;flex-basis:auto}.date-controls{align-items:stretch}.calendar-popover{left:0;right:auto;width:min(286px,100vw - 36px)}main{height:auto;margin:12px 12px 24px;grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid #2c3c54}#messages{height:620px;max-height:none}.detail-head{flex-direction:column}}
nav{display:block}.toolbar-main{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.inbox-tools{display:contents}.toolbar-main>.back-button,.toolbar-main>#refresh,.toolbar-main>.pager,.toolbar-main>.segmented,.toolbar-main>.date-controls,.toolbar-main>.calendar-btn{flex:0 0 auto}.toolbar-main>.search{flex:1 1 260px;min-width:220px;max-width:420px}.toolbar-status{margin-top:9px;color:#b7c9dc;font-size:14px;line-height:1.35;overflow-wrap:anywhere}.date-controls{max-width:100%}.date-presets{max-width:100%;flex-wrap:wrap}@media(max-width:980px){.toolbar-main>.search{order:10;flex-basis:100%;max-width:none}.toolbar-main>.segmented{order:20}.toolbar-main>.date-controls{order:21}}@media(max-width:560px){nav{padding:14px}.toolbar-main{gap:8px}.toolbar-main>.pager,.toolbar-main>.segmented,.toolbar-main>.date-controls{width:100%}.toolbar-main>.pager button,.toolbar-main>.segmented button,.toolbar-main>.date-controls .date-presets button{flex:1}.toolbar-main>.date-controls{align-items:stretch}.toolbar-main>.date-controls .date-presets{flex:1}}
</style>
<nav><div class="toolbar-main"><a class="back-button" href="/" aria-label="Back to draft review" title="Back">←</a><button id="refresh">↻ Refresh</button><div class="inbox-tools"><div class="pager"><button id="first">Newest</button><button id="next" disabled>Older emails →</button></div><label class="search"><span>🔍</span><input id="search" placeholder="Search sender or subject"></label><div class="segmented" aria-label="Read filter"><button data-read-mode="all" class="active">All</button><button data-read-mode="unread">Unread</button><button data-read-mode="read">Read</button></div><div class="date-controls"><div class="date-presets" aria-label="Date filter"><button data-date-mode="all" class="active">All</button><button data-date-mode="today">Today</button><button data-date-mode="yesterday">Yesterday</button><button data-date-mode="7">Last 7 days</button><button data-date-mode="thisMonth">This Month</button><button data-date-mode="lastMonth">Last Month</button></div><button class="calendar-btn" id="calendar-toggle" title="Calendar">📅</button><div class="calendar-popover hidden" id="calendar-popover"><div class="calendar-head"><span id="calendar-title"></span><span id="calendar-range"></span></div><div class="calendar-grid" id="calendar-grid"></div></div></div></div></div><div class="toolbar-status" id="status" role="status">Loading Outlook…</div></nav>
<main><section class="list"><div id="messages"></div></section><article><div class="detail-head"><div><h2 id="subject">Select an email</h2><div id="sender"></div></div><button class="create-draft" id="create-draft" disabled>✨ Create draft reply</button></div><pre id="body" class="empty-help">Select a message to preview it here. Viewing here does not mark it as read.</pre></article></main>
<script src="security.js"></script>
<script>
const $=id=>document.getElementById(id);const provider='outlook';let nextPage=null,generation=0,selection=0,allMessages=[],selectedMessageId='',readMode='all',dateMode='all',dateRange=null;const providerName='Outlook';document.title='Outlook emails — AI Email Agent';
function showToast(message,type='ok'){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast '+type;t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),4200)}
function snippetFor(m){return m.preview||m.bodyPreview||m.snippet||''}
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function rangeFor(mode){const today=dayStart(new Date());if(mode==='all')return null;if(mode==='today')return{start:today,end:today};if(mode==='yesterday'){const y=addDays(today,-1);return{start:y,end:y}}if(mode==='7')return{start:addDays(today,-6),end:today};if(mode==='thisMonth')return{start:new Date(today.getFullYear(),today.getMonth(),1),end:new Date(today.getFullYear(),today.getMonth()+1,0)};if(mode==='lastMonth')return{start:new Date(today.getFullYear(),today.getMonth()-1,1),end:new Date(today.getFullYear(),today.getMonth(),0)};return null}
function sameDay(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function labelDate(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function setDateMode(mode){dateMode=mode;dateRange=rangeFor(mode);document.querySelectorAll('[data-date-mode]').forEach(b=>b.classList.toggle('active',b.dataset.dateMode===mode));renderCalendar();renderMessages()}
function matchesDate(m){if(!dateRange)return true;const d=dayStart(new Date(m.date));if(Number.isNaN(d.getTime()))return true;return d>=dateRange.start&&d<=dateRange.end}
function renderCalendar(){const grid=$('calendar-grid');grid.replaceChildren();const today=dayStart(new Date());const titleBase=dateRange?.end||today;$('calendar-title').textContent=titleBase.toLocaleDateString(undefined,{month:'long',year:'numeric'});$('calendar-range').textContent=dateRange?(sameDay(dateRange.start,dateRange.end)?labelDate(dateRange.start):labelDate(dateRange.start)+' - '+labelDate(dateRange.end)):'All dates';['S','M','T','W','T','F','S'].forEach(d=>{const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.append(el)});const monthStart=new Date(titleBase.getFullYear(),titleBase.getMonth(),1);const first=addDays(monthStart,-monthStart.getDay());for(let i=0;i<42;i++){const d=addDays(first,i);const el=document.createElement('div');el.className='cal-day';el.textContent=d.getDate();if(d.getMonth()!==titleBase.getMonth())el.classList.add('muted');if(dateRange&&d>=dateRange.start&&d<=dateRange.end)el.classList.add('in-range');if(dateRange&&(sameDay(d,dateRange.start)||sameDay(d,dateRange.end)))el.classList.add('range-edge');if(sameDay(d,today))el.classList.add('today');grid.append(el)}}
function filtered(){const q=$('search').value.trim().toLowerCase();return allMessages.filter(m=>(readMode==='all'||(readMode==='unread'?m.unread:!m.unread))&&matchesDate(m)&&(!q||[m.subject,m.sender_name,m.sender,snippetFor(m)].filter(Boolean).join(' ').toLowerCase().includes(q)))}
function renderMessages(){const list=filtered();$('messages').replaceChildren();for(const m of list){const b=document.createElement('button');b.className='mail';b.innerHTML='<strong></strong><span></span><em></em><small></small>';b.querySelector('strong').textContent=(m.unread?'● ':'')+(m.subject||'(No subject)');b.querySelector('span').textContent=m.sender_name||m.sender||'Unknown sender';b.querySelector('em').textContent=snippetFor(m);b.querySelector('small').textContent=m.date||'';b.onclick=()=>openMessage(m.id,b);$('messages').append(b)}$('status').textContent=list.length+' of '+allMessages.length+' '+provider+' emails shown. Viewing here does not mark them as read.'}
async function api(params){
 const r=await fetch('/api/inbox/'+provider+'?'+new URLSearchParams(params),{headers:{Accept:'application/json'}});
 const contentType=r.headers.get('content-type')||'';
 if(!contentType.includes('application/json'))throw Error('Mailbox API is unavailable on this address. Open the app from the main dashboard server.');
 const data=await r.json();if(!r.ok)throw Error(data.error||'Could not load emails');return data;
}
async function load(page='',reset=false){
 const gen=++generation;++selection;selectedMessageId='';const hadMessages=allMessages.length>0;if(reset){allMessages=[];$('messages').replaceChildren()}$('next').disabled=true;$('status').textContent=(hadMessages&&!reset?'Refreshing ':'Loading ')+provider+'…';$('subject').textContent='Select an email';$('sender').textContent='';$('body').className='empty-help';$('body').textContent='Select a message to preview it here. Viewing here does not mark it as read.';$('create-draft').disabled=true;
 try{const data=await api(page?{page}:{});if(gen!==generation)return;nextPage=data.next_page;
 allMessages=data.messages||[];renderMessages();$('next').disabled=!nextPage;
 }catch(e){if(gen===generation)$('status').textContent=(hadMessages&&!reset?e.message+' Previously loaded emails remain below.':e.message);}
}
async function openMessage(id,button){const gen=generation,sel=++selection;selectedMessageId=id;document.querySelectorAll('.mail').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');$('subject').textContent='Loading message…';$('sender').textContent='';$('body').className='';$('body').textContent='';$('create-draft').disabled=true;try{const {message:m}=await api({id});if(gen!==generation||sel!==selection)return;$('subject').textContent=m.subject;$('sender').textContent=(m.sender_name?m.sender_name+' — ':'')+m.sender+' · '+m.date;$('body').textContent=m.body||'(No text body)';$('create-draft').disabled=false;}catch(e){if(gen===generation&&sel===selection)$('subject').textContent=e.message;}}
async function createDraftReply(){if(!selectedMessageId)return;const btn=$('create-draft');btn.disabled=true;const old=btn.textContent;btn.textContent='Creating…';try{const r=await fetch('/api/inbox/outlook/draft-reply',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({message_id:selectedMessageId})});const data=await r.json();if(!r.ok)throw Error(data.error||'Could not create draft');showToast(data.existing?'Already in AI Draft Review':'Draft reply created in AI Draft Review');}catch(e){showToast(e.message,'err');}finally{btn.textContent=old;btn.disabled=false;}}
$('refresh').onclick=()=>load();$('first').onclick=()=>load();$('next').onclick=()=>load(nextPage,true);$('search').oninput=renderMessages;document.querySelectorAll('[data-date-mode]').forEach(b=>b.onclick=()=>setDateMode(b.dataset.dateMode));document.querySelectorAll('[data-read-mode]').forEach(b=>b.onclick=()=>{readMode=b.dataset.readMode;document.querySelectorAll('[data-read-mode]').forEach(x=>x.classList.toggle('active',x===b));renderMessages()});$('calendar-toggle').onclick=()=>$('calendar-popover').classList.toggle('hidden');$('create-draft').onclick=createDraftReply;setDateMode('all');load();
</script>
</html>
